<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Gardens</title>
    <link rel="stylesheet" href="style.css" id="light-theme" />
    <link rel="stylesheet" href="style2.css" id="dark-theme" disabled />
  </head>
  <body>
    <div id="app">
      <h1 class="title" id="garden-title">.🪴.</h1>

      <div class="toolbar">
        <span id="points">Points: 0</span>
        <button id="toggle-theme">Toggle Theme</button>
      </div>

      <!-- Removed Plant Options Bar -->

      <div id="garden" class="garden"></div>

      <!-- Task Controls Menu -->
      <div id="task-menu" class="task-menu hidden">
        <button onclick="editTask()">Edit</button>
        <button onclick="completeTask()">Complete</button>
        <button onclick="removeTask()">Remove</button>
      </div>

  <div id="task-form" class="hidden">
  <div class="task-form">
    <h3>Create a Task</h3>
    <input type="text" id="task-name" placeholder="Task name" />
    <select id="task-color">
      <option value="white" data-cost="0">White (Free)</option>
      <option value="red" data-cost="5">Red (5 pts)</option>
      <option value="blue" data-cost="10">Blue (10 pts)</option>
      <option value="goldenrod" data-cost="15">Yellow (15 pts)</option>
      <option value="green" data-cost="20">Green (20 pts)</option>
    </select>
    <div class="modal-buttons">
      <button onclick="confirmTask()">Plant</button>
      <button onclick="cancelTaskForm()" class="cancel">Cancel</button>
    </div>
  </div>
</div>

    <script src="anim.js"></script>
    <script src="script.js" defer></script>
    <script src="homepage.js"></script>
  </body>
</html>
